name: IkaMachi
options:
  bundleIdPrefix: com.tora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  IkaMachiKit:
    path: IkaMachiKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  IkaMachi:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources/Commons
        type: folder
    dependencies:
      - package: IkaMachiKit
      - target: IkaMachiWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tora.ikamachi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: イカマチ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.tora.ikamachi.refresh]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/IkaMachi.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tora.ikamachi]

  IkaMachiWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Resources/Commons
        type: folder
    dependencies:
      - package: IkaMachiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tora.ikamachi.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: イカマチ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/IkaMachiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tora.ikamachi]

schemes:
  IkaMachi:
    build:
      targets:
        IkaMachi: all
    run:
      config: Debug
